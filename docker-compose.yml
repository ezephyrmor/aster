# ------------------------------------------------------------------------------
# ASTER HR - Local PostgreSQL Database (Docker)
#
# Provides the local development PostgreSQL database used by Prisma.
# Start it with:        docker compose up -d
# Stop it with:         docker compose down
# Reset it with:        docker compose down && docker compose rm -f
#
# Credentials are read from the project .env file (see sample.env for all options):
#   POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_PORT
# Defaults (matching sample.env) are used when a variable is not set.
# ------------------------------------------------------------------------------

services:
  db:
    image: postgres:16
    container_name: aster-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aster}
      POSTGRES_USER: ${POSTGRES_USER:-aster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aster}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aster_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-aster}", "-d", "${POSTGRES_DB:-aster}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  aster_postgres_data:
